<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style id="css">
/* Layout: glowing aurora behind a bolt-marked hero, sticky glass toolbar, 2-up product tiles with price pills, floating cart pill */
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{
  --bg:#f1f4fa; --solid:#ffffff; --surface:rgba(255,255,255,.86); --glass:rgba(255,255,255,.72);
  --ink:#0f1b2d; --muted:#56637a; --line:rgba(15,27,45,.10);
  --a1:#e0245e; --a2:#0086a8; --a3:#c26a00; --glow:.34;
  --accent-ink:#ffffff; --tag:#ffc233; --tag-ink:#2a1c00; --tile:#ffffff; --tile-ink:#56637a;
  --wa:#128c4b; --wa-ink:#ffffff; --out:#b3261e; --out-bg:#fbe4e1;
  --shadow:0 1px 2px rgba(15,27,45,.06),0 10px 30px rgba(15,27,45,.08);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080f1c; --solid:#131e33; --surface:rgba(22,33,56,.88); --glass:rgba(14,23,40,.72);
  --ink:#eef3fb; --muted:#9aa8c0; --line:rgba(255,255,255,.10);
  --a1:#ff6b88; --a2:#4fdcf5; --a3:#ffc061; --glow:.30;
  --accent-ink:#1d0b10; --tag:#ffc94d; --tag-ink:#2a1c00; --tile:#f6f8fc; --tile-ink:#56637a;
  --wa:#35d07f; --wa-ink:#04210f; --out:#ff9a8f; --out-bg:#3b1a17;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080f1c; --solid:#131e33; --surface:rgba(22,33,56,.88); --glass:rgba(14,23,40,.72);
  --ink:#eef3fb; --muted:#9aa8c0; --line:rgba(255,255,255,.10);
  --a1:#ff6b88; --a2:#4fdcf5; --a3:#ffc061; --glow:.30;
  --accent-ink:#1d0b10; --tag:#ffc94d; --tag-ink:#2a1c00; --tile:#f6f8fc; --tile-ink:#56637a;
  --wa:#35d07f; --wa-ink:#04210f; --out:#ff9a8f; --out-bg:#3b1a17;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* aurora */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:90vmax;height:90vmax;border-radius:50%;opacity:var(--glow);will-change:transform}
.aurora i:nth-child(1){left:-45vmax;top:-50vmax;background:radial-gradient(circle,var(--a1) 0%,transparent 62%);animation:drift1 19s ease-in-out infinite alternate}
.aurora i:nth-child(2){right:-50vmax;top:-20vmax;background:radial-gradient(circle,var(--a2) 0%,transparent 62%);animation:drift2 23s ease-in-out infinite alternate}
.aurora i:nth-child(3){left:-20vmax;bottom:-60vmax;background:radial-gradient(circle,var(--a3) 0%,transparent 62%);animation:drift3 27s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(22vmax,14vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-20vmax,22vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(26vmax,-18vmax) scale(1.1)}}
.hero,main{position:relative;z-index:1}

/* hero */
.hero .wrap{padding-block:26px 14px;display:grid;gap:12px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.bolt{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:var(--accent-ink);background:linear-gradient(135deg,var(--a1),var(--a3));box-shadow:0 6px 22px color-mix(in srgb,var(--a1) 45%,transparent);animation:charge 2.6s ease-in-out infinite}
@keyframes charge{0%,100%{box-shadow:0 6px 18px color-mix(in srgb,var(--a1) 35%,transparent)}50%{box-shadow:0 6px 34px color-mix(in srgb,var(--a3) 70%,transparent)}}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.75rem,7.4vw,2.6rem);letter-spacing:-.025em;margin:0;line-height:1.05;text-wrap:balance;overflow-wrap:anywhere;color:var(--ink);
  background:linear-gradient(90deg,var(--a1),var(--a3),var(--a2),var(--a1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:flow 9s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill2{font-size:.82rem;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-variant-numeric:tabular-nums}
.pill2.wa2{color:var(--wa);border-color:color-mix(in srgb,var(--wa) 35%,transparent)}
.contact{font-size:.9rem;margin:0;user-select:text;overflow-wrap:anywhere;color:var(--muted)}
.ownerbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* buttons */
.btn{font:700 .95rem var(--f-body);border:0;border-radius:14px;padding:11px 16px;cursor:pointer;background:linear-gradient(135deg,var(--a1),var(--a3));color:var(--accent-ink);white-space:nowrap;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--out);color:var(--solid)}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible,.tap:focus-visible,.qb:focus-visible,.wa:focus-visible{outline:2px solid var(--a2);outline-offset:2px}

/* toolbar */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-block:1px solid var(--line)}
.toolbar .wrap{padding-block:10px;display:grid;gap:10px}
.search{width:100%;font:inherit;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 .86rem var(--f-body);padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* list */
main .wrap{padding-block:16px 48px}
body.hascart main .wrap{padding-bottom:128px}
.owner-note{font-size:.85rem;color:var(--muted);margin:0 0 12px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.row{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow);animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.96)}}
@keyframes spin{to{--ang:360deg}}
.row.picked{border-color:transparent;background:linear-gradient(var(--solid),var(--solid)) padding-box,conic-gradient(from var(--ang),var(--a1),var(--a3),var(--a2),var(--a1)) border-box;animation:rise .55s cubic-bezier(.2,.8,.2,1) both,spin 3.5s linear infinite;animation-delay:calc(var(--i,0)*55ms),0s}
.tap{display:flex;flex-direction:column;flex:1;background:none;border:0;padding:8px 8px 0;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%;min-width:0;border-radius:20px}
.thumb{position:relative;aspect-ratio:1;width:100%;max-width:100%;background:var(--tile);border-radius:15px;display:grid;place-items:center;overflow:hidden;color:var(--tile-ink);font:800 2.6rem var(--f-display)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.tap:active .thumb img{transform:scale(1.07)}
.price{display:inline-block;background:var(--tag);color:var(--tag-ink);font:800 1rem var(--f-display);padding:5px 11px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;position:relative}
.price small{font:600 .68rem var(--f-body);opacity:.75;margin-left:4px}
.price.none{background:var(--solid);color:var(--muted);font-size:.8rem}
.price.lg{font-size:1.4rem;padding:7px 16px}
.thumb .price{position:absolute;right:8px;bottom:8px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.price:not(.none)::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-120%);animation:shine 4.5s ease-in-out infinite;animation-delay:calc(var(--i,0)*.35s)}
@keyframes shine{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.info{min-width:0;display:grid;gap:3px;padding:10px 4px 8px;flex:1;align-content:start}
.name{font-weight:700;font-size:.98rem;line-height:1.25;margin:0;overflow-wrap:anywhere}
.note{color:var(--muted);font-size:.82rem;line-height:1.35;margin:0;overflow-wrap:anywhere}
.row.sold .thumb img{filter:grayscale(1);opacity:.5}
.row.sold .price{background:var(--solid);color:var(--muted);text-decoration:line-through}
.row.sold .price::after{display:none}
.pack{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:4px;padding:4px 9px 4px 7px;border-radius:999px;font:700 .7rem var(--f-body);letter-spacing:.02em;background:rgba(15,27,45,.78);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pack svg{width:13px;height:13px;flex:none}
.pack.loose{background:rgba(255,255,255,.9);color:#3a4659;border:1px solid rgba(15,27,45,.15)}
.ribbon{position:absolute;left:-34px;top:16px;transform:rotate(-38deg);background:var(--out);color:var(--solid);font:800 .68rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:4px 40px}
.soldtag{margin:0 8px 8px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--out-bg);color:var(--out);font-weight:700;font-size:.9rem}
.qty{display:flex;align-items:center;gap:6px;padding:0 8px 8px}
.qb{width:42px;height:42px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--solid);color:var(--ink);font:700 1.25rem var(--f-body);cursor:pointer;display:grid;place-items:center;transition:transform .12s}
.qb:active{transform:scale(.88)}
.qb[data-d="1"]{background:linear-gradient(135deg,var(--a1),var(--a3));color:var(--accent-ink);border-color:transparent}
.qi{width:100%;min-width:0;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--solid);color:var(--ink);font:800 1.05rem var(--f-body);text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.qi::-webkit-outer-spin-button,.qi::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.empty{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:40px 20px;text-align:center;display:grid;gap:6px;justify-items:center}
.empty h2{font-family:var(--f-display);margin:0;font-size:1.25rem}
.empty p{margin:0;color:var(--muted);max-width:44ch}

/* cart pill */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none;animation:up .5s cubic-bezier(.2,1.3,.3,1) both}
@keyframes up{from{transform:translateY(120%)}}
.cartbar .in{pointer-events:auto;max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 18px;border-radius:24px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.22)}
.cartbar .sum{display:grid;line-height:1.2;min-width:0}
.cartbar .sum small{color:var(--muted);font-size:.8rem}
.cartbar .sum strong{font:800 1.35rem var(--f-display);font-variant-numeric:tabular-nums}
.cartbar .btn{padding:13px 16px;border-radius:16px;box-shadow:0 6px 20px color-mix(in srgb,var(--a1) 40%,transparent)}

/* sheets */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(5,10,20,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:end center;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--solid);color:var(--ink);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:14px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:12px;animation:sheet .42s cubic-bezier(.2,1,.3,1) both}
.sheet::before{content:"";justify-self:center;width:44px;height:5px;border-radius:9px;background:var(--line)}
@keyframes sheet{from{transform:translateY(100%)}}
@media (min-width:640px){.overlay{place-items:center}.sheet{border-radius:26px}}
.sheet h2{font-family:var(--f-display);margin:0;font-size:1.4rem}
.field{display:grid;gap:4px}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.field input,.field select{font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.preview img{width:64px;height:64px;object-fit:cover;border-radius:12px}
.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.actions .right{display:flex;gap:10px;margin-left:auto}
.err{color:var(--out);font-size:.88rem;margin:0}
.big{width:100%;max-height:58vh;object-fit:contain;border-radius:18px;background:var(--tile)}
.chk{display:flex;gap:8px;align-items:center;font-weight:600}
.chk input{width:20px;height:20px}
.lines{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.lines li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding-bottom:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;animation:rise .4s both;animation-delay:calc(var(--i,0)*50ms)}
.lines .ln{overflow-wrap:anywhere;font-weight:600}
.lines .lc{color:var(--muted);font-size:.86rem;grid-column:1}
.lines .lt{font-weight:800;grid-row:1/3;grid-column:2;align-self:center}
.total{display:flex;justify-content:space-between;align-items:baseline;font:800 1.45rem var(--f-display);font-variant-numeric:tabular-nums}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:1.08rem;padding:16px;border-radius:18px;background:var(--wa);color:var(--wa-ink);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--wa) 55%,transparent)}70%,100%{box-shadow:0 0 0 16px transparent}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;max-width:90vw}

/* add-to-cart effects */
.fly{position:fixed;z-index:40;object-fit:cover;border-radius:16px;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.spark{position:fixed;z-index:41;width:9px;height:9px;border-radius:50%;pointer-events:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script id="appjs">
(() => {
  const SKELETON_HEAD='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
  const FONTS='https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap';
  const $=id=>document.getElementById(id);
  const eur=new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"});
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let S; try{S=JSON.parse($("state").textContent)}catch{S={title:"Angebot & Preise",contact:"",items:[]}}
  S.items=S.items||[];
  let owner=false, art=null, cat="Alle", query="", editing=null, photoData=undefined, saving=false;

  function status(i){const q=+i.qty||0; if(q<=0) return ["out","Ausverkauft"]; if(q<=2) return ["low","Nur noch "+q]; return ["ok",q+" da"]}
  function toast(m){let t=$("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2600)}

  function shell(){
    $("app").innerHTML=`
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
    <section class="hero"><div class="wrap">
      <div class="top"><div class="brand">
        <span class="bolt" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M13.5 2 5 13.5h5.2L9.5 22 19 9.8h-5.6z" fill="currentColor"/></svg></span>
        <h1 id="h1"></h1></div>
        <div class="ownerbar" id="ownerbar" hidden>
          <button class="btn" id="add">+ Artikel</button>
          <button class="btn ghost" id="settings">Name</button>
        </div></div>
      <div class="pills"><span class="pill2" id="sub"></span><span class="pill2 wa2">Bestellung per WhatsApp</span></div>
      <p class="contact" id="contact"></p>
    </div></section>
    <div class="toolbar" id="toolbar"><div class="wrap">
      <input class="search" id="q" type="search" placeholder="Suchen …" aria-label="Suchen">
      <div class="chips" id="cats"></div>
    </div></div>
    <main><div class="wrap">
      <p class="owner-note" id="onote" hidden>Nur du siehst die Knöpfe zum Bearbeiten. Tipp auf einen Artikel, um ihn zu ändern.</p>
      <div class="list" id="list"></div>
    </div></main>
    <div class="cartbar" id="cartbar" hidden><div class="in">
      <div class="sum"><small id="cartcount"></small><strong id="carttotal"></strong></div>
      <button class="btn" id="cartopen">Bestellung ansehen</button>
    </div></div>
    <div class="overlay" id="ov" hidden></div>`;
    $("q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});
    $("cats").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(b){cat=b.dataset.cat;render()}});
    $("list").addEventListener("click",e=>{
      const qb=e.target.closest(".qb");
      if(qb){const id=qb.closest(".qty").dataset.q;setQty(id,(cart[id]||0)+(+qb.dataset.d));if(+qb.dataset.d>0)fx(qb);return}
      const r=e.target.closest(".tap");if(!r)return;const it=S.items.find(x=>x.id===r.dataset.id);if(!it)return;owner?openItem(it):openView(it)});
    $("list").addEventListener("input",e=>{const q=e.target.closest(".qi");if(!q)return;const id=q.closest(".qty").dataset.q;setQty(id,parseInt(q.value,10)||0,true)});
    $("list").addEventListener("focusin",e=>{const q=e.target.closest(".qi");if(q)q.select()});
    $("cartopen").onclick=openCart;
    $("add").onclick=()=>openItem(null);
    $("settings").onclick=openSettings;
    $("ov").addEventListener("click",e=>{if(e.target.id==="ov")close()});
    document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
  }

  function render(){
    $("h1").textContent=S.title||"Angebot & Preise";
    $("sub").textContent=S.items.length?`${S.items.length} Artikel`:"";
    $("sub").hidden=!S.items.length;
    $("contact").textContent=S.contact||""; $("contact").hidden=!S.contact;
    const cats=[...new Set(S.items.map(i=>i.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"de"));
    if(cat!=="Alle"&&!cats.includes(cat)) cat="Alle";
    $("cats").innerHTML=cats.length>1?["Alle",...cats].map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join(""):"";
    $("cats").hidden=cats.length<2;
    $("q").hidden=S.items.length<6;
    $("toolbar").hidden=$("q").hidden&&$("cats").hidden;
    const list=S.items.filter(i=>(cat==="Alle"||i.category===cat)&&(!query||(i.name+" "+(i.note||"")+" "+(i.category||"")+(i.pack==="ovp"?" ovp originalverpackung":i.pack==="lose"?" ohne verpackung":"")).toLowerCase().includes(query)))
      .sort((a,b)=>((!!a.soldout)-(!!b.soldout))||String(a.name).localeCompare(String(b.name),"de"));
    if(!list.length){
      $("list").innerHTML=`<div class="empty"><h2>${S.items.length?"Nichts gefunden":"Noch keine Artikel"}</h2><p>${
        S.items.length?"Versuch einen anderen Suchbegriff.":owner?"Tippe oben auf „+ Artikel“ und trag Name, Preis, Menge und gern ein Foto ein.":"Hier steht bald, was es gibt und zu welchem Preis."}</p></div>`;
      return;
    }
    $("list").innerHTML=list.map((i,idx)=>{
      const unit=i.unit&&i.unit!=="Stück"?`<small>pro ${esc(i.unit)}</small>`:"";
      const n=cart[i.id]||0;
      return `<div class="row${i.soldout?" sold":""}${n&&!i.soldout?" picked":""}" style="--i:${idx}">
        <button class="tap" data-id="${esc(i.id)}" aria-label="${esc(i.name)} ansehen">
          <div class="thumb">${i.photo?`<img src="${i.photo}" alt="">`:esc(String(i.name||"?").trim().charAt(0).toUpperCase())}
            ${i.price!=null&&i.price!==""?`<span class="price">${eur.format(i.price)}${unit}</span>`:`<span class="price none">auf Anfrage</span>`}
            ${i.soldout?`<span class="ribbon">Ausverkauft</span>`:i.pack==="ovp"?`<span class="pack" title="In Originalverpackung"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>OVP</span>`:i.pack==="lose"?`<span class="pack loose" title="Ohne Verpackung">Ohne OVP</span>`:""}</div>
          <div class="info">
            <p class="name">${esc(i.name)}</p>
            ${i.note?`<p class="note">${esc(i.note)}</p>`:""}
          </div>
        </button>
        ${i.soldout?`<div class="soldtag">Ausverkauft</div>`:`<div class="qty" data-q="${esc(i.id)}">
          <button class="qb" data-d="-1" aria-label="Eins weniger">−</button>
          <input class="qi" id="q_${esc(i.id)}" type="number" inputmode="numeric" min="0" step="1" value="${n||""}" placeholder="0" aria-label="Anzahl ${esc(i.name)}">
          <button class="qb" data-d="1" aria-label="Eins mehr">+</button>
        </div>`}
      </div>`}).join("");
  }

  function close(){if(saving)return;$("ov").hidden=true;$("ov").innerHTML=""}
  function openView(i){
    $("ov").innerHTML=`<div class="sheet">
      ${i.photo?`<img class="big" src="${i.photo}" alt="">`:""}
      <h2>${esc(i.name)}</h2>
      ${i.note?`<p class="note" style="margin:0">${esc(i.note)}</p>`:""}
      ${i.pack==="ovp"?`<p class="note" style="margin:0">In Originalverpackung</p>`:i.pack==="lose"?`<p class="note" style="margin:0">Ohne Verpackung</p>`:""}
      <div class="actions">
      ${i.price!=null&&i.price!==""?`<span class="price lg">${eur.format(i.price)}${i.unit&&i.unit!=="Stück"?`<small>pro ${esc(i.unit)}</small>`:""}</span>`:""}</div>
      ${S.contact?`<p class="note" style="margin:0">Interesse? ${esc(S.contact)}</p>`:""}
      <button class="btn ghost" id="x">Schließen</button></div>`;
    $("ov").hidden=false; $("x").onclick=close;
  }

  function parsePrice(v){const n=parseFloat(String(v).replace(/\s|€/g,"").replace(/\.(?=\d{3}\b)/g,"").replace(",","."));return isFinite(n)&&n>=0?Math.round(n*100)/100:null}
  function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const s=Math.min(1,700/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.72))};
    img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u})}

  function openItem(i){
    editing=i; photoData=undefined;
    const units=["Stück","Karton","Palette","kg","Liter","Packung","Satz","Paar"];
    if(i?.unit&&!units.includes(i.unit)) units.push(i.unit);
    const cats=[...new Set(S.items.map(x=>x.category).filter(Boolean))];
    $("ov").innerHTML=`<form class="sheet" id="f" novalidate>
      <h2>${i?"Artikel ändern":"Neuer Artikel"}</h2>
      <div class="field"><label for="fn">Name</label><input id="fn" maxlength="80" value="${esc(i?.name||"")}" placeholder="z. B. Olivenöl 1 l"></div>
      <div class="grid3" style="grid-template-columns:1fr 1fr">
        <div class="field"><label for="fp">Preis (€)</label><input id="fp" inputmode="decimal" value="${i?.price!=null?String(i.price).replace(".",","):""}" placeholder="4,90"></div>
        <div class="field"><label for="fu">Einheit</label><select id="fu">${units.map(u=>`<option${(i?.unit||"Stück")===u?" selected":""}>${esc(u)}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label for="fc">Kategorie (optional)</label><input id="fc" list="cl" maxlength="40" value="${esc(i?.category||"")}"><datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div>
      <div class="field"><label for="fo">Info (optional)</label><input id="fo" maxlength="200" value="${esc(i?.note||"")}" placeholder="Marke, Größe, Mindestabnahme …"></div>
      <div class="field"><label for="fph">Foto (optional)</label>
        <div class="preview"><img id="pv" alt="" ${i?.photo?`src="${i.photo}"`:"hidden"}><input id="fph" type="file" accept="image/*">
        <button type="button" class="btn ghost" id="rmph" ${i?.photo?"":"hidden"}>Foto weg</button></div></div>
      <div class="field"><label for="fpk">Verpackung</label><select id="fpk"><option value="">keine Angabe</option><option value="ovp"${i?.pack==="ovp"?" selected":""}>In Originalverpackung</option><option value="lose"${i?.pack==="lose"?" selected":""}>Ohne Verpackung</option></select></div>
      <label class="chk" for="fso"><input type="checkbox" id="fso" ${i?.soldout?"checked":""}> Ausverkauft</label>
      <p class="err" id="er" hidden></p>
      <div class="actions">${i?`<button type="button" class="btn ghost" id="del">Löschen</button>`:""}
        <div class="right"><button type="button" class="btn ghost" id="cn">Abbrechen</button><button class="btn" id="sv">Speichern</button></div></div>
    </form>`;
    $("ov").hidden=false; $("fn").focus();
    $("cn").onclick=close;
    $("fph").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{photoData=await shrink(f);$("pv").src=photoData;$("pv").hidden=false;$("rmph").hidden=false}catch{err("Dieses Foto lässt sich nicht öffnen.")}};
    $("rmph").onclick=()=>{photoData=null;$("pv").hidden=true;$("rmph").hidden=true;$("fph").value=""};
    if(i) $("del").onclick=()=>{
      if($("del").dataset.sure){S.items=S.items.filter(x=>x.id!==i.id);save("Gelöscht");}
      else{$("del").dataset.sure="1";$("del").textContent="Wirklich löschen?";$("del").classList.add("danger")}
    };
    $("f").onsubmit=e=>{e.preventDefault();
      const name=$("fn").value.trim(), pr=$("fp").value.trim(), price=pr?parsePrice(pr):null;
      if(!name) return err("Bitte einen Namen eintragen.");
      if(pr&&price===null) return err("Preis bitte so eintragen: 4,90");
      const data={id:i?.id||("a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),name,price,
        unit:$("fu").value,category:$("fc").value.trim(),note:$("fo").value.trim(),
        photo:photoData===undefined?(i?.photo||""):(photoData||""),soldout:$("fso").checked,pack:$("fpk").value};
      S.items=i?S.items.map(x=>x.id===i.id?data:x):[...S.items,data];
      save(i?"Gespeichert":"Hinzugefügt");
    };
  }
  function err(m){const e=$("er");if(e){e.textContent=m;e.hidden=false}else toast(m)}

  function openSettings(){
    $("ov").innerHTML=`<form class="sheet" id="sf" novalidate>
      <h2>Seite benennen</h2>
      <div class="field"><label for="st">Name der Seite</label><input id="st" maxlength="60" value="${esc(S.title)}" placeholder="z. B. Großhandel Müller"></div>
      <div class="field"><label for="sc">Kontakt (optional)</label><input id="sc" maxlength="120" value="${esc(S.contact)}" placeholder="z. B. Bestellen per WhatsApp: 0170 1234567"></div>
      <p class="err" id="er" hidden></p>
      <div class="actions"><div class="right"><button type="button" class="btn ghost" id="cn">Abbrechen</button><button class="btn" id="sv">Speichern</button></div></div>
    </form>`;
    $("ov").hidden=false; $("cn").onclick=close;
    $("sf").onsubmit=e=>{e.preventDefault();S.title=$("st").value.trim()||"Angebot & Preise";S.contact=$("sc").value.trim();save("Gespeichert")};
  }

  function buildDoc(){
    const json=JSON.stringify(S).replace(/</g,"\\u003c");
    return SKELETON_HEAD+"\n"+
      `<title>${esc(S.title||"Angebot & Preise")}</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n`+
      `<link rel="stylesheet" href="${FONTS}">\n`+
      `<style id="css">${$("css").textContent}</style>\n<div id="app"></div>\n`+
      `<script type="application/json" id="state">${json}<\/script>\n`+
      `<script id="appjs">${$("appjs").textContent}<\/script>\n</body></html>`;
  }
  async function save(msg){
    if(!art) return err("Speichern geht hier gerade nicht.");
    saving=true; const b=$("sv"); if(b){b.disabled=true;b.textContent="Speichert …"}
    try{ await art.publish(buildDoc()); toast(msg); }
    catch(x){
      saving=false; if(b){b.disabled=false;b.textContent="Speichern"}
      if(x?.code==="conflict") return;
      if(x?.code==="too_large") return err("Die Seite ist zu groß. Lösch ein paar Fotos oder Artikel.");
      if(x?.code==="not_writer"||x?.code==="not_granted"){owner=false;$("ownerbar").hidden=true;close();render();return}
      err("Speichern hat nicht geklappt. Bitte nochmal versuchen.");
    }
  }

  const WA="491630458386";
  let cart={}; try{cart=JSON.parse(localStorage.getItem("warenkorb")||"{}")||{}}catch{cart={}}
  function saveCart(){try{localStorage.setItem("warenkorb",JSON.stringify(cart))}catch{}}
  function lines(){return S.items.filter(i=>cart[i.id]>0&&!i.soldout).map(i=>{const n=cart[i.id],p=(i.price!=null&&i.price!=="")?+i.price:null;return{i,n,p,t:p==null?null:Math.round(n*p*100)/100}})}
  function setQty(id,n,fromInput){
    n=Math.max(0,Math.min(9999,Math.floor(n)||0));
    if(n)cart[id]=n;else delete cart[id];
    saveCart();
    const box=document.querySelector(`.qty[data-q="${CSS.escape(id)}"]`);
    if(box){box.closest(".row").classList.toggle("picked",!!n);const inp=box.querySelector(".qi");if(!fromInput)inp.value=n||""}
    updateBar();
  }
  function updateBar(){
    const L=lines(),pcs=L.reduce((a,l)=>a+l.n,0),tot=L.reduce((a,l)=>a+(l.t||0),0);
    $("cartbar").hidden=!L.length; document.body.classList.toggle("hascart",!!L.length);
    $("cartcount").textContent=`${pcs} Stück · ${L.length} ${L.length===1?"Artikel":"Artikel"}`;
    countTo(tot);
  }
  const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let shown=0,raf=0;
  function countTo(v){
    if(calm){shown=v;$("carttotal").textContent=eur.format(v);return}
    cancelAnimationFrame(raf);const from=shown,t0=performance.now();
    const step=t=>{const k=Math.min(1,(t-t0)/420),e=1-Math.pow(1-k,3);shown=from+(v-from)*e;$("carttotal").textContent=eur.format(shown);if(k<1)raf=requestAnimationFrame(step);else shown=v};
    raf=requestAnimationFrame(step);
  }
  function bump(){const c=$("cartbar");if(!c.hidden)c.querySelector(".in").animate([{transform:"scale(1)"},{transform:"scale(1.05)"},{transform:"scale(1)"}],{duration:320,easing:"ease-out"})}
  function fx(btn){
    try{navigator.vibrate&&navigator.vibrate(12)}catch{}
    if(calm||!btn.animate)return;
    const row=btn.closest(".row"),img=row.querySelector(".thumb img"),inp=row.querySelector(".qi");
    inp.animate([{transform:"scale(1)"},{transform:"scale(1.18)"},{transform:"scale(1)"}],{duration:260,easing:"ease-out"});
    const b=btn.getBoundingClientRect(),cols=["var(--a1)","var(--a2)","var(--a3)"];
    for(let k=0;k<8;k++){const sp=document.createElement("i");sp.className="spark";sp.style.left=b.left+b.width/2+"px";sp.style.top=b.top+b.height/2+"px";sp.style.background=cols[k%3];document.body.appendChild(sp);
      const a=Math.PI*2*k/8+Math.random()*.6,d=28+Math.random()*24;
      sp.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(0)`,opacity:0}],{duration:520,easing:"ease-out"}).onfinish=()=>sp.remove()}
    if(!img){bump();return}
    const r=img.getBoundingClientRect(),t=$("carttotal").getBoundingClientRect(),g=img.cloneNode();
    g.className="fly";Object.assign(g.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"});document.body.appendChild(g);
    const dx=t.left+t.width/2-(r.left+r.width/2),dy=t.top+t.height/2-(r.top+r.height/2);
    g.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${dx*.45}px,${dy*.45-70}px) scale(.55)`,opacity:1,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.06)`,opacity:.3}],{duration:640,easing:"cubic-bezier(.5,0,.3,1)"}).onfinish=()=>{g.remove();bump()};
  }
  function waText(name){
    const L=lines(),tot=L.reduce((a,l)=>a+(l.t||0),0);
    let t="Hallo, ich möchte gerne bestellen:\n\n";
    L.forEach(l=>{t+=l.p==null?`${l.n} × ${l.i.name} (Preis auf Anfrage)\n`:`${l.n} × ${l.i.name} à ${eur.format(l.p)} = ${eur.format(l.t)}\n`});
    t+=`\nGesamt: ${eur.format(tot)}`;
    if(name)t+=`\n\nVon: ${name}`;
    return t;
  }
  function openCart(){
    const L=lines(); if(!L.length)return;
    const tot=L.reduce((a,l)=>a+(l.t||0),0);
    let nm=""; try{nm=localStorage.getItem("bestellname")||""}catch{}
    $("ov").innerHTML=`<div class="sheet">
      <h2>Deine Bestellung</h2>
      <ul class="lines">${L.map((l,k)=>`<li style="--i:${k}"><span class="ln">${l.n} × ${esc(l.i.name)}</span><span class="lc">${l.p==null?"Preis auf Anfrage":"à "+eur.format(l.p)}</span><span class="lt">${l.t==null?"–":eur.format(l.t)}</span></li>`).join("")}</ul>
      <div class="total"><span>Gesamt</span><span>${eur.format(tot)}</span></div>
      <div class="field"><label for="cname">Dein Name oder Geschäft (optional)</label><input id="cname" maxlength="80" value="${esc(nm)}" placeholder="z. B. Kiosk Müller"></div>
      <a class="btn wa" id="wa" target="_blank" rel="noopener">Per WhatsApp bestellen</a>
      <p class="note" style="margin:0;text-align:center">WhatsApp öffnet sich mit deiner fertigen Bestellung. Du musst nur noch auf Senden tippen.</p>
      <div class="actions"><button class="btn ghost" id="clr">Warenkorb leeren</button><div class="right"><button class="btn ghost" id="x">Weiter auswählen</button></div></div>
    </div>`;
    const upd=()=>{const v=$("cname").value.trim();try{localStorage.setItem("bestellname",v)}catch{};$("wa").href="https://wa.me/"+WA+"?text="+encodeURIComponent(waText(v))};
    upd(); $("cname").addEventListener("input",upd);
    $("x").onclick=close;
    $("clr").onclick=()=>{if($("clr").dataset.sure){cart={};saveCart();close();render();updateBar()}else{$("clr").dataset.sure="1";$("clr").textContent="Wirklich leeren?"}};
    $("ov").hidden=false;
  }

  shell(); render(); updateBar();
  (async()=>{
    if(!window.claude?.use) return;
    const [u,a]=await Promise.all([claude.use("user"),claude.use("artifact")]);
    art=a;
    owner=!!(a&&u&&(u.isOwner()||u.canEdit()));
    $("ownerbar").hidden=!owner; $("onote").hidden=!owner||!S.items.length;
    render();
  })();
})();
</script>

</body></html>
