<style id="css">
/* Layout: one clean price list (photo · name · stock · price), sticky header with search; owner tools only for the owner */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#15302a; --muted:#5d716b; --line:#dbe2df;
  --tag:#f3c63f; --tag-ink:#2a2208; --accent:#1f6b5a; --accent-ink:#ffffff;
  --ok:#2e7d4f; --ok-bg:#e3f2e8; --warn:#9a5b00; --warn-bg:#fdf0d6; --out:#a33a2c; --out-bg:#f9e2de;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111a18; --surface:#18231f; --ink:#e4ece9; --muted:#9aaca6; --line:#2b3a35;
  --tag:#e9bb34; --tag-ink:#231b04; --accent:#5cc2a6; --accent-ink:#0d1a16;
  --ok:#7fd3a0; --ok-bg:#183327; --warn:#f2c26b; --warn-bg:#352a12; --out:#f2958a; --out-bg:#3a1c18;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a18; --surface:#18231f; --ink:#e4ece9; --muted:#9aaca6; --line:#2b3a35;
  --tag:#e9bb34; --tag-ink:#231b04; --accent:#5cc2a6; --accent-ink:#0d1a16;
  --ok:#7fd3a0; --ok-bg:#183327; --warn:#f2c26b; --warn-bg:#352a12; --out:#f2958a; --out-bg:#3a1c18;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:14px 12px;display:grid;gap:10px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top>div{min-width:0}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,4.5vw,2rem);letter-spacing:-.02em;margin:0;line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:.9rem;margin:3px 0 0;font-variant-numeric:tabular-nums}
.contact{font-size:.9rem;margin:2px 0 0;user-select:text;overflow-wrap:anywhere}
.btn{font:600 .92rem var(--f-body);border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--out);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ownerbar{display:flex;gap:8px;flex-wrap:wrap}
.search{width:100%;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;font:500 .85rem var(--f-body);padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
main .wrap{padding-block:16px 48px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.row{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(21,48,42,.06),0 6px 18px rgba(21,48,42,.06)}
@media (prefers-reduced-motion:no-preference){.row{transition:transform .15s,box-shadow .15s}.row:hover{transform:translateY(-2px)}}
.thumb{aspect-ratio:1;width:100%;max-width:100%;background:var(--bg);display:grid;place-items:center;overflow:hidden;color:var(--muted);font:700 2.6rem var(--f-display)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.info{min-width:0;display:grid;gap:3px;padding:12px 12px 6px;flex:1;align-content:start}
.row .price{align-self:flex-start;margin:4px 12px 12px}
.list .empty{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.name{font-weight:700;font-size:1.02rem;margin:0;overflow-wrap:anywhere}
.note{color:var(--muted);font-size:.86rem;margin:0;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.cat{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.pill{font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.low{background:var(--warn-bg);color:var(--warn)} .pill.out{background:var(--out-bg);color:var(--out)}
.price{background:var(--tag);color:var(--tag-ink);font:800 1.05rem var(--f-display);padding:5px 10px;border-radius:8px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.price small{display:block;font:600 .68rem var(--f-body);opacity:.75}
.price.none{background:var(--bg);color:var(--muted);font-size:.85rem}
.empty{padding:40px 20px;text-align:center;display:grid;gap:6px;justify-items:center}
.empty h2{font-family:var(--f-display);margin:0;font-size:1.25rem}
.empty p{margin:0;color:var(--muted);max-width:44ch}
.owner-note{font-size:.85rem;color:var(--muted);margin:0 0 12px}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,20,17,.5);display:grid;place-items:end center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:12px}
@media (min-width:640px){.overlay{place-items:center}.sheet{border-radius:18px}}
.sheet h2{font-family:var(--f-display);margin:0;font-size:1.35rem}
.field{display:grid;gap:4px}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.grid3 .field:last-child{grid-column:span 2}}
.preview{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.preview img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.actions .right{display:flex;gap:10px;margin-left:auto}
.err{color:var(--out);font-size:.88rem;margin:0}
.big{width:100%;max-height:62vh;object-fit:contain;border-radius:12px;background:var(--bg)}
.price.lg{font-size:1.4rem;padding:6px 14px}
.row{cursor:default}
.tap{display:flex;flex-direction:column;flex:1;background:none;border:0;padding:0;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.tap:focus-visible,.qb:focus-visible,.qi:focus-visible,.wa:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.qty{display:flex;align-items:center;gap:6px;padding:0 12px 12px}
.qb{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 1.2rem var(--f-body);cursor:pointer;display:grid;place-items:center}
.qi{width:100%;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 1rem var(--f-body);text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.qi::-webkit-outer-spin-button,.qi::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty.on .qi{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.qty.on .qb[data-d="1"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cartbar .in{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cartbar .sum{display:grid;line-height:1.2;min-width:0}
.cartbar .sum small{color:var(--muted);font-size:.82rem}
.cartbar .sum strong{font:800 1.25rem var(--f-display);font-variant-numeric:tabular-nums}
body.hascart main .wrap{padding-bottom:120px}
.lines{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.lines li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding-bottom:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lines .ln{overflow-wrap:anywhere}
.lines .lc{color:var(--muted);font-size:.86rem;grid-column:1}
.lines .lt{font-weight:700;grid-row:1/3;grid-column:2;align-self:center}
.total{display:flex;justify-content:space-between;align-items:baseline;font:800 1.3rem var(--f-display);font-variant-numeric:tabular-nums}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:1.05rem;padding:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:90vw}
</style>

<script id="appjs">
(() => {
  const SKELETON_HEAD='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
  const FONTS='https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap';
  const $=id=>document.getElementById(id);
  const eur=new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"});
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let S; try{S=JSON.parse($("state").textContent)}catch{S={title:"Angebot & Preise",contact:"",items:[]}}
  S.items=S.items||[];
  let owner=false, art=null, cat="Alle", query="", editing=null, photoData=undefined, saving=false;

  function status(i){const q=+i.qty||0; if(q<=0) return ["out","Ausverkauft"]; if(q<=2) return ["low","Nur noch "+q]; return ["ok",q+" da"]}
  function toast(m){let t=$("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2600)}

  function shell(){
    $("app").innerHTML=`
    <header><div class="wrap">
      <div class="top"><div>
        <h1 id="h1"></h1>
        <p class="sub" id="sub"></p>
        <p class="contact" id="contact"></p>
      </div>
      <div class="ownerbar" id="ownerbar" hidden>
        <button class="btn" id="add">+ Artikel</button>
        <button class="btn ghost" id="settings">Name</button>
      </div></div>
      <input class="search" id="q" type="search" placeholder="Suchen …" aria-label="Suchen">
      <div class="chips" id="cats"></div>
    </div></header>
    <main><div class="wrap">
      <p class="owner-note" id="onote" hidden>Nur du siehst die Knöpfe zum Bearbeiten. Tipp auf einen Artikel, um ihn zu ändern.</p>
      <div class="list" id="list"></div>
    </div></main>
    <div class="cartbar" id="cartbar" hidden><div class="in">
      <div class="sum"><small id="cartcount"></small><strong id="carttotal"></strong></div>
      <button class="btn" id="cartopen">Bestellung ansehen</button>
    </div></div>
    <div class="overlay" id="ov" hidden></div>`;
    $("q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});
    $("cats").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(b){cat=b.dataset.cat;render()}});
    $("list").addEventListener("click",e=>{
      const qb=e.target.closest(".qb");
      if(qb){const id=qb.closest(".qty").dataset.q;setQty(id,(cart[id]||0)+(+qb.dataset.d));return}
      const r=e.target.closest(".tap");if(!r)return;const it=S.items.find(x=>x.id===r.dataset.id);if(!it)return;owner?openItem(it):openView(it)});
    $("list").addEventListener("input",e=>{const q=e.target.closest(".qi");if(!q)return;const id=q.closest(".qty").dataset.q;setQty(id,parseInt(q.value,10)||0,true)});
    $("list").addEventListener("focusin",e=>{const q=e.target.closest(".qi");if(q)q.select()});
    $("cartopen").onclick=openCart;
    $("add").onclick=()=>openItem(null);
    $("settings").onclick=openSettings;
    $("ov").addEventListener("click",e=>{if(e.target.id==="ov")close()});
    document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
  }

  function render(){
    $("h1").textContent=S.title||"Angebot & Preise";
    $("sub").textContent=S.items.length?`${S.items.length} Artikel`:"";
    $("sub").hidden=!S.items.length;
    $("contact").textContent=S.contact||""; $("contact").hidden=!S.contact;
    const cats=[...new Set(S.items.map(i=>i.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"de"));
    if(cat!=="Alle"&&!cats.includes(cat)) cat="Alle";
    $("cats").innerHTML=cats.length>1?["Alle",...cats].map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join(""):"";
    $("cats").hidden=cats.length<2;
    $("q").hidden=S.items.length<6;
    const list=S.items.filter(i=>(cat==="Alle"||i.category===cat)&&(!query||(i.name+" "+(i.note||"")+" "+(i.category||"")).toLowerCase().includes(query)))
      .sort((a,b)=>String(a.name).localeCompare(String(b.name),"de"));
    if(!list.length){
      $("list").innerHTML=`<div class="empty"><h2>${S.items.length?"Nichts gefunden":"Noch keine Artikel"}</h2><p>${
        S.items.length?"Versuch einen anderen Suchbegriff.":owner?"Tippe oben auf „+ Artikel“ und trag Name, Preis, Menge und gern ein Foto ein.":"Hier steht bald, was es gibt und zu welchem Preis."}</p></div>`;
      return;
    }
    $("list").innerHTML=list.map(i=>{
      const unit=i.unit&&i.unit!=="Stück"?`<small>pro ${esc(i.unit)}</small>`:"";
      const n=cart[i.id]||0;
      return `<div class="row">
        <button class="tap" data-id="${esc(i.id)}" aria-label="${esc(i.name)} ansehen">
          <div class="thumb">${i.photo?`<img src="${i.photo}" alt="">`:esc(String(i.name||"?").trim().charAt(0).toUpperCase())}</div>
          <div class="info">
            <p class="name">${esc(i.name)}</p>
            ${i.note?`<p class="note">${esc(i.note)}</p>`:""}
            ${i.category?`<div class="meta"><span class="cat">${esc(i.category)}</span></div>`:""}
          </div>
          ${i.price!=null&&i.price!==""?`<div class="price">${eur.format(i.price)}${unit}</div>`:`<div class="price none">auf Anfrage</div>`}
        </button>
        <div class="qty${n?" on":""}" data-q="${esc(i.id)}">
          <button class="qb" data-d="-1" aria-label="Eins weniger">−</button>
          <input class="qi" id="q_${esc(i.id)}" type="number" inputmode="numeric" min="0" step="1" value="${n||""}" placeholder="0" aria-label="Anzahl ${esc(i.name)}">
          <button class="qb" data-d="1" aria-label="Eins mehr">+</button>
        </div>
      </div>`}).join("");
  }

  function close(){if(saving)return;$("ov").hidden=true;$("ov").innerHTML=""}
  function openView(i){
    $("ov").innerHTML=`<div class="sheet">
      ${i.photo?`<img class="big" src="${i.photo}" alt="">`:""}
      <h2>${esc(i.name)}</h2>
      ${i.note?`<p class="note" style="margin:0">${esc(i.note)}</p>`:""}
      <div class="actions">
      ${i.price!=null&&i.price!==""?`<span class="price lg">${eur.format(i.price)}${i.unit&&i.unit!=="Stück"?`<small>pro ${esc(i.unit)}</small>`:""}</span>`:""}</div>
      ${S.contact?`<p class="note" style="margin:0">Interesse? ${esc(S.contact)}</p>`:""}
      <button class="btn ghost" id="x">Schließen</button></div>`;
    $("ov").hidden=false; $("x").onclick=close;
  }

  function parsePrice(v){const n=parseFloat(String(v).replace(/\s|€/g,"").replace(/\.(?=\d{3}\b)/g,"").replace(",","."));return isFinite(n)&&n>=0?Math.round(n*100)/100:null}
  function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const s=Math.min(1,700/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.72))};
    img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u})}

  function openItem(i){
    editing=i; photoData=undefined;
    const units=["Stück","Karton","Palette","kg","Liter","Packung","Satz","Paar"];
    if(i?.unit&&!units.includes(i.unit)) units.push(i.unit);
    const cats=[...new Set(S.items.map(x=>x.category).filter(Boolean))];
    $("ov").innerHTML=`<form class="sheet" id="f" novalidate>
      <h2>${i?"Artikel ändern":"Neuer Artikel"}</h2>
      <div class="field"><label for="fn">Name</label><input id="fn" maxlength="80" value="${esc(i?.name||"")}" placeholder="z. B. Olivenöl 1 l"></div>
      <div class="grid3" style="grid-template-columns:1fr 1fr">
        <div class="field"><label for="fp">Preis (€)</label><input id="fp" inputmode="decimal" value="${i?.price!=null?String(i.price).replace(".",","):""}" placeholder="4,90"></div>
        <div class="field"><label for="fu">Einheit</label><select id="fu">${units.map(u=>`<option${(i?.unit||"Stück")===u?" selected":""}>${esc(u)}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label for="fc">Kategorie (optional)</label><input id="fc" list="cl" maxlength="40" value="${esc(i?.category||"")}"><datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div>
      <div class="field"><label for="fo">Info (optional)</label><input id="fo" maxlength="200" value="${esc(i?.note||"")}" placeholder="Marke, Größe, Mindestabnahme …"></div>
      <div class="field"><label for="fph">Foto (optional)</label>
        <div class="preview"><img id="pv" alt="" ${i?.photo?`src="${i.photo}"`:"hidden"}><input id="fph" type="file" accept="image/*">
        <button type="button" class="btn ghost" id="rmph" ${i?.photo?"":"hidden"}>Foto weg</button></div></div>
      <p class="err" id="er" hidden></p>
      <div class="actions">${i?`<button type="button" class="btn ghost" id="del">Löschen</button>`:""}
        <div class="right"><button type="button" class="btn ghost" id="cn">Abbrechen</button><button class="btn" id="sv">Speichern</button></div></div>
    </form>`;
    $("ov").hidden=false; $("fn").focus();
    $("cn").onclick=close;
    $("fph").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{photoData=await shrink(f);$("pv").src=photoData;$("pv").hidden=false;$("rmph").hidden=false}catch{err("Dieses Foto lässt sich nicht öffnen.")}};
    $("rmph").onclick=()=>{photoData=null;$("pv").hidden=true;$("rmph").hidden=true;$("fph").value=""};
    if(i) $("del").onclick=()=>{
      if($("del").dataset.sure){S.items=S.items.filter(x=>x.id!==i.id);save("Gelöscht");}
      else{$("del").dataset.sure="1";$("del").textContent="Wirklich löschen?";$("del").classList.add("danger")}
    };
    $("f").onsubmit=e=>{e.preventDefault();
      const name=$("fn").value.trim(), pr=$("fp").value.trim(), price=pr?parsePrice(pr):null;
      if(!name) return err("Bitte einen Namen eintragen.");
      if(pr&&price===null) return err("Preis bitte so eintragen: 4,90");
      const data={id:i?.id||("a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),name,price,
        unit:$("fu").value,category:$("fc").value.trim(),note:$("fo").value.trim(),
        photo:photoData===undefined?(i?.photo||""):(photoData||"")};
      S.items=i?S.items.map(x=>x.id===i.id?data:x):[...S.items,data];
      save(i?"Gespeichert":"Hinzugefügt");
    };
  }
  function err(m){const e=$("er");if(e){e.textContent=m;e.hidden=false}else toast(m)}

  function openSettings(){
    $("ov").innerHTML=`<form class="sheet" id="sf" novalidate>
      <h2>Seite benennen</h2>
      <div class="field"><label for="st">Name der Seite</label><input id="st" maxlength="60" value="${esc(S.title)}" placeholder="z. B. Großhandel Müller"></div>
      <div class="field"><label for="sc">Kontakt (optional)</label><input id="sc" maxlength="120" value="${esc(S.contact)}" placeholder="z. B. Bestellen per WhatsApp: 0170 1234567"></div>
      <p class="err" id="er" hidden></p>
      <div class="actions"><div class="right"><button type="button" class="btn ghost" id="cn">Abbrechen</button><button class="btn" id="sv">Speichern</button></div></div>
    </form>`;
    $("ov").hidden=false; $("cn").onclick=close;
    $("sf").onsubmit=e=>{e.preventDefault();S.title=$("st").value.trim()||"Angebot & Preise";S.contact=$("sc").value.trim();save("Gespeichert")};
  }

  function buildDoc(){
    const json=JSON.stringify(S).replace(/</g,"\\u003c");
    return SKELETON_HEAD+"\n"+
      `<title>${esc(S.title||"Angebot & Preise")}</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n`+
      `<link rel="stylesheet" href="${FONTS}">\n`+
      `<style id="css">${$("css").textContent}</style>\n<div id="app"></div>\n`+
      `<script type="application/json" id="state">${json}<\/script>\n`+
      `<script id="appjs">${$("appjs").textContent}<\/script>\n</body></html>`;
  }
  async function save(msg){
    if(!art) return err("Speichern geht hier gerade nicht.");
    saving=true; const b=$("sv"); if(b){b.disabled=true;b.textContent="Speichert …"}
    try{ await art.publish(buildDoc()); toast(msg); }
    catch(x){
      saving=false; if(b){b.disabled=false;b.textContent="Speichern"}
      if(x?.code==="conflict") return;
      if(x?.code==="too_large") return err("Die Seite ist zu groß. Lösch ein paar Fotos oder Artikel.");
      if(x?.code==="not_writer"||x?.code==="not_granted"){owner=false;$("ownerbar").hidden=true;close();render();return}
      err("Speichern hat nicht geklappt. Bitte nochmal versuchen.");
    }
  }

  const WA="491630458386";
  let cart={}; try{cart=JSON.parse(localStorage.getItem("warenkorb")||"{}")||{}}catch{cart={}}
  function saveCart(){try{localStorage.setItem("warenkorb",JSON.stringify(cart))}catch{}}
  function lines(){return S.items.filter(i=>cart[i.id]>0).map(i=>{const n=cart[i.id],p=(i.price!=null&&i.price!=="")?+i.price:null;return{i,n,p,t:p==null?null:Math.round(n*p*100)/100}})}
  function setQty(id,n,fromInput){
    n=Math.max(0,Math.min(9999,Math.floor(n)||0));
    if(n)cart[id]=n;else delete cart[id];
    saveCart();
    const box=document.querySelector(`.qty[data-q="${CSS.escape(id)}"]`);
    if(box){box.classList.toggle("on",!!n);const inp=box.querySelector(".qi");if(!fromInput)inp.value=n||""}
    updateBar();
  }
  function updateBar(){
    const L=lines(),pcs=L.reduce((a,l)=>a+l.n,0),tot=L.reduce((a,l)=>a+(l.t||0),0);
    $("cartbar").hidden=!L.length; document.body.classList.toggle("hascart",!!L.length);
    $("cartcount").textContent=`${pcs} Stück · ${L.length} ${L.length===1?"Artikel":"Artikel"}`;
    $("carttotal").textContent=eur.format(tot);
  }
  function waText(name){
    const L=lines(),tot=L.reduce((a,l)=>a+(l.t||0),0);
    let t="Hallo, ich möchte gerne bestellen:\n\n";
    L.forEach(l=>{t+=l.p==null?`${l.n} × ${l.i.name} (Preis auf Anfrage)\n`:`${l.n} × ${l.i.name} à ${eur.format(l.p)} = ${eur.format(l.t)}\n`});
    t+=`\nGesamt: ${eur.format(tot)}`;
    if(name)t+=`\n\nVon: ${name}`;
    return t;
  }
  function openCart(){
    const L=lines(); if(!L.length)return;
    const tot=L.reduce((a,l)=>a+(l.t||0),0);
    let nm=""; try{nm=localStorage.getItem("bestellname")||""}catch{}
    $("ov").innerHTML=`<div class="sheet">
      <h2>Deine Bestellung</h2>
      <ul class="lines">${L.map(l=>`<li><span class="ln">${l.n} × ${esc(l.i.name)}</span><span class="lc">${l.p==null?"Preis auf Anfrage":"à "+eur.format(l.p)}</span><span class="lt">${l.t==null?"–":eur.format(l.t)}</span></li>`).join("")}</ul>
      <div class="total"><span>Gesamt</span><span>${eur.format(tot)}</span></div>
      <div class="field"><label for="cname">Dein Name oder Geschäft (optional)</label><input id="cname" maxlength="80" value="${esc(nm)}" placeholder="z. B. Kiosk Müller"></div>
      <a class="btn wa" id="wa" target="_blank" rel="noopener">Per WhatsApp bestellen</a>
      <p class="note" style="margin:0;text-align:center">WhatsApp öffnet sich mit deiner fertigen Bestellung. Du musst nur noch auf Senden tippen.</p>
      <div class="actions"><button class="btn ghost" id="clr">Warenkorb leeren</button><div class="right"><button class="btn ghost" id="x">Weiter auswählen</button></div></div>
    </div>`;
    const upd=()=>{const v=$("cname").value.trim();try{localStorage.setItem("bestellname",v)}catch{};$("wa").href="https://wa.me/"+WA+"?text="+encodeURIComponent(waText(v))};
    upd(); $("cname").addEventListener("input",upd);
    $("x").onclick=close;
    $("clr").onclick=()=>{if($("clr").dataset.sure){cart={};saveCart();close();render();updateBar()}else{$("clr").dataset.sure="1";$("clr").textContent="Wirklich leeren?"}};
    $("ov").hidden=false;
  }

  shell(); render(); updateBar();
  (async()=>{
    if(!window.claude?.use) return;
    const [u,a]=await Promise.all([claude.use("user"),claude.use("artifact")]);
    art=a;
    owner=!!(a&&u&&(u.isOwner()||u.canEdit()));
    $("ownerbar").hidden=!owner; $("onote").hidden=!owner||!S.items.length;
    render();
  })();
})();
</script>

</body></html>
